name: sync-b

# FightOdds capture (design: private repo CLAUDE_HANDOFF_FIGHTODDS_CAPTURE.md +
# FIGHTODDS_LIVE_ROLLOUT_2026-08-13.md). Current UFC/DWCS moneylines from
# api.fightodds.io. GitHub cron is throttled hard, so like the BFO job this
# runs HOURLY with an internal loop: 6 polls ~10 min apart, committing after
# each so data lands even if a later poll (or the runner) dies. ~22 requests
# per poll at >=1s spacing = ~0.04 req/s average, ~40x under the calibrated
# limit (canaries passed from runner IPs 2026-08-13: 20/20 events, 0 fails).
# A 429/403 aborts that poll (rc=2, nothing published) and we wait for the
# next slot. Cadence rollback = drop the loop back to a single poll.
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "canary-discovery | canary-event | cycle"
        required: true
        default: cycle
        type: choice
        options: [canary-discovery, canary-event, cycle]

permissions:
  contents: write
  actions: write    # self-chaining dispatch

concurrency:
  group: fightodds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 2026-09-03: was 58. Each poll cycle now takes ~3 min (moneylines + props over
    # a fuller event list) and the loop slept its way past the cap — every run since
    # 09-02T16:42Z was killed at minute 58 during the sleep before poll 6, after five
    # good commits. A killed job never chains its successor, so capture fell back to
    # throttled cron (~5h gaps) and the warehouse health gate refused. The loop below
    # is now deadline-aware and exits successfully; this cap is headroom, not the plan.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Offline parser tests
        run: |
          python test_poll_fightodds.py
          python test_poll_fightodds_props.py
          python test_snapshot_io.py

      - name: Poll loop
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'cycle' }}"
          echo "mode: $MODE"
          if [ "$MODE" != "cycle" ]; then
            case "$MODE" in
              canary-discovery) python poll_fightodds.py --canary discovery ;;
              canary-event)     python poll_fightodds.py --canary event ;;
            esac
            exit $?
          fi
          git config user.name  "odds-capture-bot"
          git config user.email "actions@github.com"
          git config merge.keepmine.driver "true"
          PUSH_FAIL=0
          # Deadline-aware loop: never start a sleep+poll that cannot finish inside
          # BUDGET seconds. Uses the previous cycle's measured duration as the
          # estimate, so a slower event list just yields fewer polls per job (the
          # self-chained successor picks up immediately) instead of a timeout kill.
          JOB_START=$(date +%s)
          BUDGET=3300          # 55 min
          LAST_CYCLE=240       # conservative first estimate (4 min)
          for i in 1 2 3 4 5 6; do
            if [ "$i" -gt 1 ]; then
              ELAPSED=$(( $(date +%s) - JOB_START ))
              if [ $(( ELAPSED + 540 + LAST_CYCLE + 60 )) -gt "$BUDGET" ]; then
                echo "budget: ${ELAPSED}s elapsed, next sleep+poll would overrun ${BUDGET}s — ending after $((i-1)) polls; successor chains now"
                break
              fi
              sleep 540
            fi
            CYCLE_START=$(date +%s)
            echo "=== fightodds poll $i of 6 ==="
            set +e
            python poll_fightodds.py --out-dir data
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "::warning::poll $i aborted — nothing published"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            else
              set +e
              python poll_fightodds_props.py --out-dir data --days 7
              prop_rc=$?
              set -e
              if [ "$prop_rc" -eq 2 ]; then
                echo "::warning::prop poll $i aborted — moneylines remain valid"
              elif [ "$prop_rc" -ne 0 ]; then
                exit "$prop_rc"
              fi
            fi
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              OK=0
              for a in 1 2 3; do
                git rebase --abort >/dev/null 2>&1 || true
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && OK=1 && break
                echo "push attempt $a failed, retrying"; sleep 5
              done
              # $GITHUB_ENV only reaches later steps — same-step test needs the shell var
              if [ "$OK" -ne 1 ]; then
                PUSH_FAIL=1
              elif [ -n "$PRIVATE_REPO_TOKEN" ]; then
                REVISION=$(git rev-parse HEAD)
                curl --fail --silent --show-error \
                  -X POST \
                  -H "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/tbdprojectusername/odds-capture/dispatches \
                  -d "{\"event_type\":\"odds-capture-updated\",\"client_payload\":{\"revision\":\"$REVISION\"}}" \
                  || echo "::warning::private hot-state dispatch failed; cron fallback remains"
              fi
            else
              echo "no new rows on poll $i"
            fi
            LAST_CYCLE=$(( $(date +%s) - CYCLE_START ))
            echo "cycle $i took ${LAST_CYCLE}s"
          done
          [ "$PUSH_FAIL" -eq 0 ] || { echo "::error::a poll commit failed to push"; exit 1; }

      - name: Chain the next run
        # GitHub throttles cron hard (observed: hourly schedules firing ~every
        # 5h, leaving multi-hour capture gaps). A successful run dispatches its
        # own successor; the concurrency group queues it until this run exits,
        # so coverage is continuous. Cron stays as the recovery path if the
        # chain ever breaks. Failure does NOT chain (no failure loops).
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fightodds.yml -R "$GITHUB_REPOSITORY" || echo "::warning::self-chain dispatch failed; cron fallback remains"
